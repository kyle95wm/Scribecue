# Scribecue's relay. Run it locally with `npm run dev`; see README.md here.
name = "scribecue-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Where it's served. Cloudflare makes the DNS record and certificate.
routes = [{ pattern = "share.kyleadvoice.ca", custom_domain = true }]
workers_dev = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]

[vars]
# Pages that may connect, besides localhost.
ORIGINS = "https://scribecue.kyleadvoice.ca"
