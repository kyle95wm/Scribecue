server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Local-only: the page may not talk to any other origin, except GitHub's API
    # for the opt-in update check (see app/js/update.js). Media is loaded
    # from your disk through blob: URLs and never uploaded anywhere.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
