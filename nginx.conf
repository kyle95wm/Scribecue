server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Local-only: the page may not talk to any other origin, except GitHub's API
    # for the opt-in update check (see app/js/update.js). Piper voices are reached
    # through this server, under /tts/. Media is loaded
    # from your disk through blob: URLs and never uploaded anywhere.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Piper voices (optional, see docker-compose.yml): only listing voices and reading
    # text, on the same origin, so the page never talks to anything else. The name is
    # looked up when asked, so Scribecue still starts when Piper isn't running.
    location = /tts/voices {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $piper piper:5000;
        proxy_pass http://$piper/voices;
    }
    location = /tts/synthesize {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $piper piper:5000;
        proxy_pass http://$piper/synthesize;
        proxy_read_timeout 60s;
    }
}
