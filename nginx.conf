server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Local-only: the page may not talk to any other origin, except GitHub's API
    # for the opt-in update check (see app/js/update.js). Piper and Kokoro voices are
    # reached through this server, under /tts/, Whisper under /stt/ and ffmpeg under
    # /ffmpeg/. Media is loaded from your disk through blob: URLs, and only sent to the
    # ffmpeg container on this computer, when you ask for the mix in the video.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: https://api.github.com https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com https://texttospeech.googleapis.com https://openrouter.ai https://api.themoviedb.org http://localhost:11434 http://127.0.0.1:11434; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The guides are Markdown, shown inside Scribecue
    location /guides/ {
        types { text/markdown md; image/png png; }
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Piper voices (optional, see docker-compose.yml): only listing voices and reading
    # text, on the same origin, so the page never talks to anything else. The name is
    # looked up when asked, so Scribecue still starts when Piper isn't running.
    location = /tts/voices {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $piper piper:5000;
        proxy_pass http://$piper/voices;
    }
    location = /tts/synthesize {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $piper piper:5000;
        proxy_pass http://$piper/synthesize;
        proxy_read_timeout 60s;
    }

    # Kokoro voices (optional, see docker-compose.yml), the same way as Piper's.
    location = /tts/kokoro/voices {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kokoro kokoro:5000;
        proxy_pass http://$kokoro/voices;
    }
    location = /tts/kokoro/synthesize {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kokoro kokoro:5000;
        proxy_pass http://$kokoro/synthesize;
        proxy_read_timeout 120s;
    }

    # Whisper speech to text (optional, see docker-compose.yml), the same way: only
    # checking it's there and transcribing a block's audio.
    location = /stt/status {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $whisper whisper:5000;
        proxy_pass http://$whisper/status;
    }
    location = /stt/transcribe {
        limit_except POST { deny all; }
        client_max_body_size 32m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $whisper whisper:5000;
        proxy_pass http://$whisper/transcribe;
        proxy_read_timeout 300s;
    }

    # ffmpeg (optional, see docker-compose.yml): the full mix in other formats, and in a
    # copy of the video. Videos are big, so they go straight through to the container,
    # without being kept here first, and so does the result on its way back.
    location /ffmpeg/ {
        limit_except GET POST PUT DELETE { deny all; }
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ffmpeg ffmpeg:5000;
        rewrite ^/ffmpeg(/.*)$ $1 break;
        proxy_pass http://$ffmpeg;
    }
}
