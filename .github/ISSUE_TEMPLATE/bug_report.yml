name: Bug report
description: Something in Scribecue doesn't work, or works wrongly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. The details below help track it down quickly.

        **Please don't attach programme material** (video, audio or scripts you don't have the rights to share). A screenshot or a short description is enough. Remove API keys from anything you paste.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In Scribecue, open Settings, then General, and click Diagnostics…. Click Copy and paste it here, straight after the problem happens if you can. Issues are public, so read it first. If Scribecue won't open, skip this and fill in the next three.
      render: text
  - type: input
    id: version
    attributes:
      label: Scribecue version
      description: Skip this if you added the diagnostics. Otherwise, the version number in the bottom right of Scribecue.
      placeholder: v0.87.0
  - type: dropdown
    id: where
    attributes:
      label: Which Scribecue
      options:
        - The web version (scribecue.kyleadvoice.ca)
        - The web version, installed as an app
        - Running it myself with Docker
        - Running it myself without Docker (for development)
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      description: Skip this if you added the diagnostics. Otherwise, with their versions if you know them.
      placeholder: Chrome 156 on macOS 15, Edge 156 on Windows 11
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: Skip this if you added the diagnostics.
      options:
        - Transcribe
        - Write
        - QC
        - Record
        - Several, or it doesn't matter
  - type: checkboxes
    id: area
    attributes:
      label: What it involves
      description: Tick any that apply.
      options:
        - label: Video or audio (opening a file, playback, audio tracks, waveform)
        - label: Hold-to-mark or block timing
        - label: Speech to text (Whisper)
        - label: Text to speech (Piper, Kokoro, Google, Amazon Polly or browser voices)
        - label: Extended AD
        - label: Recording narration (takes, levels, the narration WAV)
        - label: QC (packages, comments, return packages)
        - label: AI help
        - label: Saving, autosave, projects, or opening scripts
        - label: Exporting (scripts, the description track, the full mix, the extended video)
        - label: ffmpeg
        - label: Working offline, updates or installing
        - label: Keyboard shortcuts
        - label: A screen reader or other assistive technology
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What went wrong, including any message Scribecue showed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      description: As exactly as you can, from opening Scribecue. Say if it happens every time or only sometimes.
      placeholder: |
        1. Open an MP4 with two audio tracks
        2. Switch to Transcribe mode and turn on speech to text
        3. Mark three blocks with H
        4. …
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: About the file, if it involves one
      description: Its container and audio, such as "MKV, two AAC tracks, 45 minutes". Not the file itself.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Screenshots help a lot. If Scribecue won't open, press F12, or Cmd+Option+J on a Mac, and copy any red errors here.
  - type: textarea
    id: analysis
    attributes:
      label: Analysis
      description: Optional. If Claude Code or Codex helped you with this report, paste what it found. Check it first, and say what you're unsure of.
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I've checked the [open issues](https://github.com/kyle95wm/Scribecue/issues) and this isn't one of them.
          required: true
        - label: I'm on the latest version, or have said above which one I'm on.
          required: true
