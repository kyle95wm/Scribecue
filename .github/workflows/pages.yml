name: Publish web app

# Publishes the web version of Scribecue to GitHub Pages with each release, so people
# using it get releases rather than every change on main. A release starts with a
# "Release X.Y.Z" commit on main (see INSTALL.md), which is what triggers this. It runs
# from main rather than from the release's tag, because the github-pages environment
# only allows main. It can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and unit tests
        run: scripts/check.sh --no-docker
      - name: Build the web version
        run: |
          mkdir _site
          cp -R app/. _site/
          sed -i 's/^export const HOSTED = false;/export const HOSTED = true;/' _site/js/config.js
          grep -q '^export const HOSTED = true;' _site/js/config.js
          mkdir -p _site/guides/docs
          cp README.md GETTING-STARTED.md WRITING.md VOICES.md SHORTCUTS.md TRANSCRIBING.md AI.md GOOGLE-VOICES.md INSTALL.md _site/guides/
          cp -R docs/screenshots _site/guides/docs/
      - name: Piper voices for the browser
        run: scripts/web-piper.sh _site
      - name: Whisper speech to text for the browser
        run: scripts/web-whisper.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
