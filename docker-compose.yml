services:
  scribecue:
    build: .
    image: scribecue:latest
    container_name: scribecue
    # Bound to 127.0.0.1 so only this machine can reach the editor.
    # Change the port with SCRIBECUE_PORT=9000 docker compose up -d
    ports:
      - "127.0.0.1:${SCRIBECUE_PORT:-8484}:8080"
    networks: [default, voices]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Optional natural-sounding text to speech voices that run on this computer.
  # Turn it on with COMPOSE_PROFILES=piper in a .env file next to this one (see INSTALL.md).
  piper:
    build:
      context: ./piper
      args:
        # Which voices to include, by Piper name. Set PIPER_VOICES in .env to change them,
        # then rebuild. The first is the default.
        PIPER_VOICES: ${PIPER_VOICES:-en_US-lessac-medium en_US-ryan-medium en_GB-alba-medium en_GB-alan-medium}
    image: scribecue-piper:latest
    container_name: scribecue-piper
    profiles: [piper]
    # Only on the internal network: no internet, and no port on this computer.
    # Scribecue's server is the only thing that can reach it.
    networks: [voices]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Optional speech to text that runs on this computer: Whisper fills in the text of the
  # blocks you mark. Turn it on by adding whisper to COMPOSE_PROFILES in .env (see INSTALL.md).
  whisper:
    build:
      context: ./whisper
      args:
        # Which model, by faster-whisper name. Set WHISPER_MODEL in .env to change it, then
        # rebuild. small.en is a good balance of accuracy and speed for English.
        WHISPER_MODEL: ${WHISPER_MODEL:-small.en}
    image: scribecue-whisper:latest
    container_name: scribecue-whisper
    profiles: [whisper]
    # Like Piper: only on the internal network, with no internet and no port on this
    # computer. Scribecue's server is the only thing that can reach it.
    networks: [voices]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Optional AI models that run on this computer, for AI help (see INSTALL.md). Turn it on
  # by adding ollama to COMPOSE_PROFILES in .env, then download a model that can see
  # images: docker compose exec ollama ollama pull gemma3:4b
  ollama:
    image: ollama/ollama:0.40.3
    container_name: scribecue-ollama
    profiles: [ollama]
    # Bound to 127.0.0.1: the editor in your browser talks to it, nothing else can. The
    # port is the one the editor's security policy allows, so it can't move; quit the
    # Ollama app if you have it, as only one can use the port.
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      # Pages allowed to use it besides this computer's own, such as the web version.
      OLLAMA_ORIGINS: ${OLLAMA_ORIGINS:-https://scribecue.kyleadvoice.ca}
    volumes:
      - ollama-models:/root/.ollama
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  voices:
    internal: true

volumes:
  # Downloaded models, kept when the container is rebuilt.
  ollama-models:
