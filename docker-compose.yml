services:
  scribecue:
    build: .
    image: scribecue:latest
    container_name: scribecue
    # Bound to 127.0.0.1 so only this machine can reach the editor.
    # Change the port with SCRIBECUE_PORT=9000 docker compose up -d
    ports:
      - "127.0.0.1:${SCRIBECUE_PORT:-8484}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
